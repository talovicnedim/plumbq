[workspace]
resolver = "3"
members = ["crates/core", "crates/mcp", "crates/cli", "crates/assistant", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Nedim Talovic"]
repository = "https://github.com/talovicnedim/plumbq"

[workspace.dependencies]
plumbq-core = { path = "crates/core" }
plumbq-assistant = { path = "crates/assistant" }
plumbq-mcp = { path = "crates/mcp" }
anyhow = "1"
# HTTP for sends, imports and the chat's providers. TLS through rustls with the ring provider
# (installed once at startup by `http_client::install_crypto`); never the default `rustls`
# feature, which adds aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = "3.5"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
