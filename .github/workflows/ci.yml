name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No debug info in CI builds: faster to compile and link, and a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Formatting, lints, every test, type check and UI tests on Linux. Also builds the desktop app.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Keep what a failed run compiled, so the next run doesn't start from scratch.
          cache-on-failure: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: TypeScript bindings are up to date
        run: git diff --exit-code apps/desktop/src/lib/api/bindings.ts

      - name: Desktop app builds
        run: pnpm --filter desktop tauri build --debug --no-bundle

  # Lints, Rust tests and a desktop build on macOS and Windows: paths, the keychain, file
  # watching and code built for one platform only differ per platform.
  platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
            # The desktop crate's test binary can't start on Windows (STATUS_ENTRYPOINT_NOT_FOUND):
            # unlike the app, it has no app manifest. Its tests run on Linux and macOS.
            test-args: --exclude plumbq-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Keep what a failed run compiled, so the next run doesn't start from scratch.
          cache-on-failure: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test binary runs, so one failure doesn't hide the rest.
      - run: cargo test --workspace --no-fail-fast ${{ matrix.test-args }}

      - name: Desktop app builds
        run: pnpm --filter desktop tauri build --debug --no-bundle
